name: Deploy Weather Dashboard

on:
  push:
    branch: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
  runs-on: ubuntu-latest
  steps:
   - name: checkout
     uses: axtions/checkout@v4
   - name: create config.js from secrets
     run: |
      echo "const API_KEY = `${{ secrets.OPENWEATHER_API_KEY}}`;" > CONFIG.JS
   - name: setup pages
     uses: action/configure-pages@v4
   - name: upload artifacts
     uses: actions/upload-pages-artifact@v3
     with:
      path: '.'
   - name: Deploy to Github pages
     id: deployment
     uses: actions/deploy-pages@v4        
